<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Agenda Pro. Willian Cortes</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Willian Cortes">
    <link rel="apple-touch-icon" href="logo.jpg.jpg">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #F4F4F9; color: #000000; display: flex; justify-content: center; min-height: 100vh; }
        .app-container { width: 100%; max-width: 100%; background-color: #FFFFFF; padding: 8px; padding-bottom: 90px; box-shadow: 0 0 20px rgba(0, 0, 0, 0.05); }
        .barber-header { border-bottom: 1px solid #EAEAEA; padding-bottom: 10px; margin-bottom: 12px; text-align: center; }
        .brand-logo-container { width: 60px; height: 60px; background: #FFFFFF; border: 2px solid #000000; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 6px auto; overflow: hidden; }
        .brand-logo-container img { width: 100%; height: 100%; object-fit: cover; }
        .barber-header h1 { font-size: 1.1rem; color: #000000; margin-bottom: 2px; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; }
        .barber-header p { font-size: 0.7rem; color: #666666; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 500; }
        #login-section { min-height: 50vh; display: flex; flex-direction: column; justify-content: center; padding: 0 15px; }
        .custom-modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.6); display: flex; justify-content: center; align-items: center; z-index: 9999; opacity: 0; visibility: hidden; transition: 0.2s ease-in-out; }
        .custom-modal-overlay.active { opacity: 1; visibility: visible; }
        .custom-modal { background: #FFFFFF; border: 1px solid #EAEAEA; border-radius: 8px; padding: 20px; width: 90%; max-width: 400px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .custom-modal h3 { color: #000000; font-size: 1rem; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
        .custom-modal p { color: #555555; font-size: 0.85rem; margin-bottom: 15px; line-height: 1.4; text-align: left; }
        .custom-modal input, .custom-modal select { width: 100%; padding: 10px; background: #F9F9F9; border: 1px solid #DDDDDD; border-radius: 6px; color: #000000; font-size: 0.95rem; margin-bottom: 12px; outline: none; }
        .custom-modal-buttons { display: flex; gap: 8px; flex-direction: column; }
        .custom-modal-btn { width: 100%; padding: 10px; border-radius: 6px; font-size: 0.85rem; font-weight: bold; cursor: pointer; border: none; text-transform: uppercase; }
        .btn-modal-cancelar { background: #EEEEEE; color: #000000; border: 1px solid #CCCCCC; }
        .btn-modal-confirmar { background: #000000; color: #FFFFFF; }
        .btn-modal-atendido { background: #25D366; color: #FFFFFF; }
        .btn-modal-editar { background: #3498db; color: #FFFFFF; }
        .btn-modal-excluir { background: #FFF5F5; color: #e74c3c; border: 1px solid #e74c3c; }
        .week-horizontal-container { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; margin-top: 8px; width: 100%; overflow-x: hidden; }
        .day-column { background: #F9F9F9; border: 1px solid #EAEAEA; border-radius: 4px; padding: 3px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
        .day-header { font-size: 0.62rem; color: #000000; font-weight: bold; border-bottom: 1px solid #EAEAEA; padding-bottom: 3px; display: flex; flex-direction: column; gap: 2px; text-align: center; }
        .slot-item { background: #FFFFFF; padding: 4px 3px; border-radius: 3px; font-size: 0.6rem; display: flex; flex-direction: column; gap: 1px; border: 1px solid #EAEAEA; border-left: 2px solid #CCCCCC; color: #000000; cursor: pointer; transition: 0.15s; overflow: hidden; }
        .slot-item:hover { opacity: 0.85; }
        .slot-item.booked { border-left-color: #25D366; background: #F0FFF4; }
        .slot-item.mensalista { border-left-color: #9b59b6; background: #F5EEF8; }
        .slot-item.concluded { border-left-color: #3498db; background: #F0F8FF; }
        .slot-item.blocked { border-left-color: #e74c3c; background: #FFF5F5; }
        .slot-item.available { border-left-color: #000000; background: #FFFFFF; }
        .datetime-inputs, .client-inputs { display: flex; flex-direction: column; gap: 12px; }
        .input-group { display: flex; flex-direction: column; gap: 5px; }
        .input-group label { font-size: 0.85rem; color: #555555; }
        input, select { width: 100%; padding: 12px; background: #F9F9F9; border: 1px solid #DDDDDD; border-radius: 6px; color: #000000; font-size: 1rem; outline: none; transition: 0.2s; }
        input:focus, select:focus { border-color: #000000; background: #FFFFFF; }
        .btn-whatsapp { width: 100%; padding: 10px; background-color: #000000; color: #FFFFFF; border: none; border-radius: 6px; font-size: 0.85rem; font-weight: bold; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 6px; transition: 0.2s; text-transform: uppercase; }
        .btn-whatsapp:hover { background-color: #333333; }
    </style>
</head>

                        <i class="fa-solid fa-right-from-bracket"></i> Sair
                    </button>
